[program:daedalus_progress]
environment=PROC_NAME="%(program_name)s"
command=/opt/supervisor-scripts/daedalus_progress.sh
autostart=true
autorestart=unexpected
startsecs=2
startretries=3
stdout_logfile=/dev/stdout
redirect_stderr=true
stdout_logfile_maxbytes=0

[program:daedalus_resume]
environment=PROC_NAME="%(program_name)s"
command=/opt/supervisor-scripts/daedalus_resume.sh
autostart=true
autorestart=false
startsecs=0
stdout_logfile=/dev/stdout
redirect_stderr=true
stdout_logfile_maxbytes=0

[program:daedalus_session_keeper]
environment=PROC_NAME="%(program_name)s"
command=/opt/supervisor-scripts/daedalus_session_keeper.sh
autostart=true
autorestart=unexpected
exitcodes=0,1
startsecs=5
startretries=3
stdout_logfile=/dev/stdout
redirect_stderr=true
stdout_logfile_maxbytes=0
